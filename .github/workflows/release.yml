name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      # --provenance ties the published tarball to this workflow run, so anyone
      # can check the package was built from the commit it claims.
      # No token: npm exchanges the OIDC id-token for a short-lived one, and
      # the trusted publisher configured on npmjs.com decides whether this
      # repository and workflow may publish at all.
      - run: npm publish --provenance --access public
